<!doctype html>
<meta charset="utf-8"><title>demo: pull requests</title>
<style>
body{font:14px/1.45 -apple-system,system-ui,sans-serif;margin:0;color:#222;background:#fff}
header{background:#24292f;color:#fff;padding:10px 16px;display:flex;gap:16px;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:600}header a.nav{font-weight:400;opacity:.85}header form{margin-left:auto}
header input{padding:4px 8px;border-radius:4px;border:1px solid #888;width:260px}
header small{opacity:.7}
main{padding:12px 16px;max-width:1200px}
nav.crumbs a{color:#0969da;text-decoration:none}nav.crumbs{margin-bottom:10px}
table{border-collapse:collapse;width:100%}td,th{padding:4px 8px;text-align:left;border-bottom:1px solid #eee;vertical-align:top}
a{color:#0969da}
pre.code{margin:0;border:1px solid #ddd;border-radius:6px;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
pre.code div{display:flex;white-space:pre}
pre.code div:target{background:#fff8c5}
pre.code .n{width:52px;text-align:right;padding:0 8px;color:#999;user-select:none;flex:none}
pre.code .n a{color:#999;text-decoration:none}
pre.code .bl{width:200px;flex:none;color:#666;padding:0 8px;overflow:hidden;text-overflow:ellipsis}
pre.code .t{padding:0 8px}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid #ddd;border-radius:6px;overflow:auto}
.diff div{white-space:pre;padding:0 8px}.diff .a{background:#e6ffec}.diff .d{background:#ffebe9}.diff .k{color:#0969da;background:#f6f8fa}.diff .f{font-weight:600;background:#f6f8fa;margin-top:8px}.diff .h{color:#666}
.sha{font-family:ui-monospace,Menlo,monospace;color:#666}
.muted{color:#666}
</style>
<style>
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff;background:#8250df}.pill.open{background:#1a7f37}.pill.merged{background:#8250df}.pill.closed{background:#cf222e}
.pill.success{background:#1a7f37}.pill.failure{background:#cf222e}.pill.pending{background:#9a6700}
.box{background:#fff;border:1px solid #ddd;border-radius:6px;padding:10px 12px;margin:10px 0}
.ev{border-left:3px solid #ddd;padding:4px 10px;margin:8px 0}.ev.review.approve{border-color:#1a7f37}.ev.review.request_changes{border-color:#cf222e}.ev .who{font-weight:600}.ev .when{color:#666;font-size:12px;margin-left:6px}
textarea,input[type=text],select{width:100%;box-sizing:border-box;padding:6px;font:inherit}textarea{min-height:70px}
form.inline{display:inline}button{padding:5px 12px;margin-top:6px}button.primary{background:#1a7f37;color:#fff;border:0;border-radius:4px}button.danger{background:#cf222e;color:#fff;border:0;border-radius:4px}
.err{background:#ffebe9;border:1px solid #cf222e;padding:8px;border-radius:6px}.block{background:#fff8c5;border:1px solid #d4a72c;padding:8px;border-radius:6px}
details summary{cursor:pointer}pre.log{font:11px/1.4 ui-monospace,Menlo,monospace;background:#f6f8fa;padding:8px;overflow:auto;max-height:300px}
.two{display:flex;gap:12px;flex-wrap:wrap}.two>div{flex:1;min-width:280px}
</style>
<header style="pointer-events:none"><a data-href="/">demo</a><a data-href="/pulls" class="nav">pull requests</a><small>vault mirror</small></header>
<main>


<h3>Pull requests <a data-href="/pulls/new" style="font-weight:400;font-size:13px">+ new</a> <span class="muted" style="font-weight:400;font-size:13px">· <a data-href="/pulls?all=1">show all</a></span></h3>

<td><span class="pill open">open</span></td><td><span class="pill success">✓ demo</span> </td>
<td><span class="pill success" title="./.secretgit/ci passed in 0s">ci</span> </td></tr></table>



</main>
