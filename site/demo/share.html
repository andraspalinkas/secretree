<title>secretgit share</title>
<style>

.meta{color:#666;margin:8px 0 12px}

.diff div{white-space:pre;padding:0 8px}.diff .a{background:#e6ffec}.diff .d{background:#ffebe9}.diff .k{color:#0969da;background:#f6f8fa}.diff .f{font-weight:600;background:#f6f8fa;margin-top:8px}.diff .h{color:#666}
.err{color:#b00;font-weight:600}.warn{background:#fff8c5;border:1px solid #e0c800;padding:8px;border-radius:6px;margin-bottom:12px}
</style></head><body>
<header><b>secretgit share</b><small id="hdr">encrypted snapshot</small></header>
<main>
<div id="unlock">
<p>This page contains an encrypted snapshot. The host that serves it cannot read it. Paste the key you received through another channel, or open the link that carries it after <code>#</code>.</p>
<input id="key" placeholder="AGE-SECRET-KEY-1..." autocomplete="off" spellcheck="false">
<button id="go">Decrypt</button>
<p class="err" id="err"></p>
</div>
<div id="view" hidden></div>
</main>
<script type="module">
import * as age from "https://cdn.jsdelivr.net/npm/age-encryption@0.3.1/+esm";
const ARMORED = document.getElementById("ct").textContent;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function unlock(key) {
  key = key.trim();
  if (!key.startsWith("AGE-SECRET-KEY-1")) { $("err").textContent = "that is not an age identity"; return; }
  try {
    const d = new age.Decrypter();
    d.addIdentity(key);
    const text = await d.decrypt(age.armor.decode(ARMORED), "text");
    render(JSON.parse(text));
  } catch (e) { $("err").textContent = "decryption failed: " + (e && e.message ? e.message : e); }
}
function render(s) {
  $("unlock").hidden = true; const v = $("view"); v.hidden = false;
  $("hdr").textContent = s.title || "";
  let h = "";
  if (s.expires && Date.now() > Date.parse(s.expires)) h += `<div class="warn">This share expired on ${esc(s.expires)}. Treat its contents as stale.</div>`;
  h += `<div class="meta">${esc(s.type)} · ${esc(s.subject||"")} · shared ${esc(s.created||"")}${s.note?" · "+esc(s.note):""}</div>`;
  if (s.type === "diff") {
    h += '<div class="diff">' + s.content.split("\n").map(l => {
      const c = l.startsWith("+++")||l.startsWith("---") ? "h" : l.startsWith("+") ? "a" : l.startsWith("-") ? "d" : l.startsWith("@@") ? "k" : l.startsWith("diff ") ? "f" : "";
      return `<div class="${c}">${esc(l)}</div>`; }).join("") + "</div>";
  } else {
    const lines = s.content.replace(/\n$/, "").split("\n");
    h += '<pre class="code">' + lines.map((l,i) => `<div id="L${i+1}"><span class="n">${i+1}</span><span class="t">${esc(l)}</span></div>`).join("") + "</pre>";
  }
  v.innerHTML = h;
  const tgt = location.hash.split("|")[1]; if (tgt && self === top) { const e = document.getElementById(tgt); e && e.scrollIntoView({block:"center"}); }
}
$("go").onclick = () => unlock($("key").value);
$("key").addEventListener("keydown", e => { if (e.key === "Enter") unlock($("key").value); });
const frag = decodeURIComponent(location.hash.slice(1)).split("|")[0];
if (frag.startsWith("AGE-SECRET-KEY-1")) { $("key").value = frag; unlock(frag); }
</script>
