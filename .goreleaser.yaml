# goreleaser configuration: one static binary per platform, checksums,
# and an archive that also carries the docs so an offline restore has them.
version: 2
project_name: secretree
builds:
  - main: ./cmd/secretree
    binary: secretree
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/andraspalinkas/secretree/internal/app.Version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, docs/*]
checksum:
  name_template: checksums.txt
release:
  draft: true
