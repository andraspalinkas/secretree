<!doctype html>
<meta charset="utf-8"><title>secretgit link</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#222}code{background:#f3f3f3;padding:1px 4px;border-radius:3px}</style>
<h2>secretgit link</h2>
<p id="msg">Opening this link in your local secretgit UI…</p>
<p class="muted">If nothing happens, start it with <code>secretgit ui</code> and reload. The code never leaves your machine; this page only forwards the path.</p>
<script>
// Host this page on the git host itself (GitHub Pages, a static bucket): the
// path after it is forwarded to the local UI, so links pasted in chat work
// for everyone who holds a key and reveal only a path hit to the host.
(function () {
  var base = "http://127.0.0.1:7391";
  var here = location.pathname.replace(/^\/[^/]*\/?/, ""); // strip the page's own prefix
  var q = location.search, h = location.hash;
  var target = base + "/" + here + q + h;
  document.getElementById("msg").innerHTML = "Opening <code>" + target.replace(/</g, "&lt;") + "</code>…";
  location.replace(target);
})();
</script>
